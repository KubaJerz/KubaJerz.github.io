<style>
  :root {
    --paper: #f5f4ef;
    --ink: #201f1d;
    --muted: #7c786f;
    --accent: #b68235;
    --font-display: "Cormorant Garamond", Georgia, serif;
    --font-body: "Lora", Georgia, serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .mark {
    position: absolute;
    top: 26px;
    left: 26px;
    width: 52px;
    height: auto;
  }

  .card {
    text-align: center;
    max-width: 460px;
    width: 100%;
  }

  .portrait {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 44px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 42px;
    line-height: 1.1;
    letter-spacing: -0.005em;
    margin: 0;
  }

  .tagline {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 22px;
    line-height: 1.3;
    color: color-mix(in srgb, var(--ink) 88%, transparent);
    margin: 12px 0 0;
  }

  .role {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 13.5px;
    letter-spacing: 0.01em;
    color: var(--muted);
    margin: 22px 0 0;
  }

  .links {
    margin-top: 30px;
    font-family: var(--font-body);
    font-size: 14px;
  }

  .links a {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }
  .links a:hover { color: var(--accent); }

  .links .dot {
    color: var(--muted);
    margin: 0 10px;
  }

  @media (max-width: 480px) {
    h1 { font-size: 38px; }
    .portrait { width: 120px; height: 120px; margin-bottom: 40px; }
    .mark { top: 18px; left: 18px; width: 42px; }
  }
</style>
</head>
